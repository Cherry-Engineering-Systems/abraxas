[project]
name = "abraxas-graphql"
version = "1.0.0"
description = "Abraxas GraphQL API — Strawberry + ArangoDB"
requires-python = ">=3.11"
dependencies = [
    "strawberry-graphql[fastapi]>=0.220.0",
    "python-arango>=8.0.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
